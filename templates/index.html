<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinia Mini App</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e90ff">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 3em;
        }
        #counter {
            font-size: 2em;
            margin: 20px 0;
        }
        button {
            background-color: #1e90ff;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch(error => console.error('Service Worker registration failed:', error));
        }

        function updateCounter() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/get_balance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('counter').textContent = data.balance + ' AffinyCoins';
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function getReferralLink() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/create_referral_link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    alert('Referral link: ' + data.link);
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function getConsentLink() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/create_consent_link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    alert('Consent link: ' + data.link);
                })
                .catch(error => console.error('Error:', error));
            }
        }

        Telegram.WebApp.ready();
        updateCounter();
    </script>
</head>
<body>
    <h1>Affinia</h1>
    <div id="counter">Loading...</div>
    <button onclick="getReferralLink()">Referral Link</button>
    <button onclick="getConsentLink()">Consent Link</button>
</body>
</html>
