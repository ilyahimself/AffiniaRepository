<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinia Mini App</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e90ff">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 3em;
        }
        #counter {
            font-size: 2em;
            margin: 20px 0;
        }

         /* Стили для модального окна */
         #referral-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        #referral-modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            position: relative;
        }

        /* Стили для кнопки "Close" */
        #close-referral-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #888;
            border: none;
            background: none;
            cursor: pointer;
        }

        #close-referral-modal:hover {
            color: #000;
        }

        button {
            background-color: #1e90ff;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch(error => console.error('Service Worker registration failed:', error));
        }

        function updateCounter() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/get_balance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('counter').textContent = data.balance + ' AffinyCoins';
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function getReferralLink() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/create_referral_link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    alert('Referral link: ' + data.link);
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function showReferralModal() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/generate_referral_qr', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        document.getElementById('qr-code').src = `data:image/png;base64,${data.qr_code}`;
                        document.getElementById('referral-link').textContent = data.referral_link;
                        document.getElementById('referral-modal').style.display = 'flex';
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }

        function closeReferralModal() {
            document.getElementById('referral-modal').style.display = 'none';
        }

       // Отправить реферальную ссылку
        function sendReferralLink() {
            const referralLink = document.getElementById('referral-link').textContent;

            if (referralLink) {
                // Формируем ссылку для открытия списка чатов
                const shareLink = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}`;

                // Открываем Telegram с предложением выбрать чат
                Telegram.WebApp.openTelegramLink(shareLink);

                // Сворачиваем приложение
                Telegram.WebApp.close();
            } else {
                alert('Referral link not found.');
            }
        }

        function getConsentLink() {
            if (Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                fetch('/create_consent_link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe.user.id })
                })
                .then(response => response.json())
                .then(data => {
                    alert('Consent link: ' + data.link);
                })
                .catch(error => console.error('Error:', error));
            }
        }

        Telegram.WebApp.ready();
        updateCounter();
    </script>
</head>
<body>
    <h1>Affinia</h1>
    <div id="counter">Loading...</div>
    <button onclick="showReferralModal()">Referral Link</button>
    <button onclick="getConsentLink()">Consent Link</button>

    <div id="referral-modal">
        <div id="referral-modal-content">
            <button id="close-referral-modal" onclick="closeReferralModal()">x</button>
            <h3 style="color: black" >Your Referral Link</h3>
            <img id="qr-code" src="" alt="QR Code" style="width:200px; height:200px;">
            <p id="referral-link" style="word-wrap:break-word;"></p>
            <button onclick="sendReferralLink()">Send</button>
        </div>
    </div>    
</body>
</html>
