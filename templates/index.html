<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinia Mini App</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e90ff">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-top: 20px;
        }

        .user-info {
            margin-top: 20px;
            text-align: center;
        }

        .user-info img {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        .user-info p {
            font-size: 1.2em;
            margin-top: 5px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #333;
            padding: 10px 0;
        }

        .nav-bar button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: white;
            padding: 10px;
            font-size: 16px;
        }

        .nav-bar button.active {
            background-color: #777a7d;
        }

        .nav-bar img {
            height: 20px;
            margin-bottom: 5px;
        }


        #counter {
            font-size: 2em;
            margin: 20px 0;
        }

        button {
            background-color: #777a7d;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #777a7d;
        }

        .text-center {
            text-align: center;
            width: 100%;  
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }


        #referral-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        #referral-modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            position: relative;
            color: #000;
        }

        #close-referral-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #888;
            border: none;
            background: none;
            cursor: pointer;
        }

        #close-referral-modal:hover {
            color: #000;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        Telegram.WebApp.ready();

        function updateUserInfo() {
            const user = Telegram.WebApp.initDataUnsafe?.user;

            if (user) {
                document.getElementById('username').textContent = user.username || `${user.first_name} ${user.last_name || ''}`;
                document.getElementById('user-avatar').src = user.photo_url || 'https://via.placeholder.com/80';
            } else {
                document.getElementById('username').textContent = 'Unknown User';
                document.getElementById('user-avatar').src = 'https://via.placeholder.com/80';
            }
        }

        function updateCounter() {
            fetch('/get_balance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe?.user?.id })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('counter').textContent = data.balance + ' AffinyCoins';
            })
            .catch(error => console.error('Error:', error));
        }

        function showReferralModal() {
            fetch('/generate_referral_qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe?.user?.id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById('qr-code').src = `data:image/png;base64,${data.qr_code}`;
                    
                    // Сохраняем ссылку в скрытом атрибуте для дальнейшего использования
                    document.getElementById('referral-link').setAttribute('data-link', data.referral_link);

                    // Скрываем текст ссылки
                    document.getElementById('referral-link').textContent = '';
                    document.getElementById('referral-modal').style.display = 'flex';
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function closeReferralModal() {
            document.getElementById('referral-modal').style.display = 'none';
        }

        function sendReferralLink() {
            const referralLink = document.getElementById('referral-link').getAttribute('data-link');

            if (referralLink) {
                const shareLink = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}`;
                Telegram.WebApp.openTelegramLink(shareLink);
                Telegram.WebApp.close();
            } else {
                alert('Referral link not found.');
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.style.display = 'none'; // Скрываем все страницы
            });
            document.querySelectorAll('.nav-bar button').forEach(button => {
                button.classList.remove('active'); // Убираем активность со всех кнопок
            });
            document.getElementById(pageId).style.display = 'block'; // Показываем нужную страницу
            document.querySelector(`button[data-page="${pageId}"]`).classList.add('active'); // Делаем кнопку активной
        }

        window.onload = function () {
            updateUserInfo();
            updateCounter();
            showPage('main-page'); // Показываем страницу Main по умолчанию
        };
    </script>
</head>
<body>
    <!-- Содержимое страницы Main -->
    <div id="main-page" class="page">
        <h1 class="text-center">Affinia</h1>

        <div class="user-info">
            <img id="user-avatar" src="https://via.placeholder.com/80" alt="User Avatar">
            <p id="username">Loading...</p>
        </div>
    
        <div id="counter" class="text-center">Loading...</div>
    
        <button onclick="showReferralModal()">Referral Link</button>
        <button onclick="getConsentLink()">Consent Link</button>
    </div>

    <!-- Содержимое страницы Friends -->
    <div id="friends-page" class="page" style="display:none;">
        <h1 class="text-center">Friends</h1>
        <!-- Пока пусто -->
    </div>
      
    <div class="nav-bar">
        <button data-page="main-page" class="nav-btn" onclick="showPage('main-page')">
            <img src="/static/house-icon.png" alt="Main"> <!-- Замените 'house-icon.png' на путь к вашей иконке домика -->
            Main
        </button>
        <button data-page="friends-page" class="nav-btn" onclick="showPage('friends-page')">
            <img src="/static/person-icon.png" alt="Friends"> <!-- Замените 'person-icon.png' на путь к вашей иконке человечка -->
            Friends
        </button>
    </div>

    <div id="referral-modal">
        <div id="referral-modal-content">
            <button id="close-referral-modal" onclick="closeReferralModal()">×</button>
            <h3>Your Referral Link</h3>
            <img id="qr-code" src="" alt="QR Code" style="width:200px; height:200px;">
            <!-- Текст ссылки скрыт, но значение сохранено в data-link -->
            <p id="referral-link" style="visibility: hidden;"></p>
            <button onclick="sendReferralLink()">Send</button>
        </div>
    </div>

    
</body>
</html>
