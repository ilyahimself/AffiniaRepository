<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinia Mini App</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e90ff">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #9789A3;
            color: #e8e6d9;
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            /* padding: 0 0 0 0; */
        }

        /* ----- Верхняя часть (шапка) ----- */
        header {
            width: 100%;
            height: 12%;
            /* text-align: center; Заголовок по центру */
            /* padding: 10px 0; */
        }

        /* header h1 {
            margin: 0;
            font-size: 2em;
        } */

        /*  ----- Контейнер аватара, ника, коинов и кнопки настроек -----  */
        .top-bar {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between; 
            padding: 0 10px;
            height: auto;
            margin-top: 10px; 
        }

        /* Левая секция (аватар, никнейм, коins) */
        .left-section {
            display: flex;
            height: auto;
            align-items: center;
        }

        .left-section img {
            border-radius: 50%;
            width: 60px;
            height: 60px;
            border: none;
        }

        .user-details {
            margin-left: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: auto;
        }

        .user-details p {
            margin: 0px;
            font-size: 1.1em;
            font-weight: 500;
            color: #e8e6d9;
            text-align: left;
        }

        /* Кнопка настроек (вертикальные три точки) */
        .settings-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #e8e6d9;
            align-items: center;
            /* height: auto; */
        }

        .settings-btn:hover {
            color: #fff;
        }
        
        /* ----- Страницы (для переключения контента) ----- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            height: 80%; 
            align-self: stretch;
        }

        .page {
            display: none;
            width: 100%;            
            align-items: center;
        }

        .page.active {
            display: block; 
        }

        /* ----- Центр экрана: кнопки Referral Link, Consent Link ----- */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60%;
        }

        .center-content button {
            background-color: #e8e6d9;
            border: none;
            color: #8d799c;
            padding: 15px 30px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            margin: 10px 5px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .center-content button:hover {
            background-color: #dcd2e4;
        }

        /* ----- Кнопка SOS (круглая), расположена над навбаром ----- */
        .sos-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40%;
        }

        .sos-button {
            background-color: #f5a89e;
            color: #8d799c;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sos-button:hover {
            background-color: #f48b81;
        }

        /* ----- Навигационный бар снизу ----- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            /* left: 0; */
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #e8e6d9;
            padding: 10px 0;
            color: #8d799c;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
            height: 8%;
        }

        .nav-bar button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: inherit;
            padding: 0px;
            font-size: 14px;
        }

        .nav-bar button img {
            width: 24px;
            height: 24px;
            margin-bottom: 5px;
        }

        .nav-bar button.active span{
            color: #f48b81;
        }

        /* ----- Модальное окно (Referral) ----- */
        #referral-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        #referral-modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            position: relative;
            color: #000;
        }

        #close-referral-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #888;
            border: none;
            background: none;
        }

        #close-referral-modal:hover {
            color: #000;
        }

        /* ----- Элементы списка друзей ----- */        
        #friends-list .friend-info {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between; 
            padding: 0 10px;
            margin-top: 10px; 
        }

        #friends-list .friend-left-section{
            display: flex;
            align-items: center;
        }

        #friends-list .friend-left-section img {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            border: none;
        }

        .friend-details {
            margin-left: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #friends-list .friend-details p {
            margin: 0px;
            font-size: 1em;
            font-weight: 500;
            color: #e8e6d9;
            text-align: left;
        }
        
        .delete-btn {
            background-color: #e8e6d9;
            color: #8d799c;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            margin-right: 10px;
        }

        .delete-btn:hover {
            background-color: #e8e6d9ea;
        }

</style>

    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        Telegram.WebApp.ready();

        function updateUserInfo() {
            const user = Telegram.WebApp.initDataUnsafe?.user;

            if (user) {
                // Если у пользователя есть username, добавляем "@", 
                // иначе используем first_name и last_name
                if (user.username) {
                    document.getElementById('username').textContent = '@' + user.username;
                } else {
                    document.getElementById('username').textContent =
                        user.first_name + (user.last_name ? ' ' + user.last_name : '');
                }
                document.getElementById('user-avatar').src = user.photo_url || 'https://via.placeholder.com/80';
            } else {
                document.getElementById('username').textContent = 'Unknown User';
                document.getElementById('user-avatar').src = 'https://via.placeholder.com/80';
            }
        }

        function updateCounter() {
            fetch('/get_balance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe?.user?.id })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('counter').textContent = data.balance + ' AFN';
            })
            .catch(error => console.error('Error:', error));
        }

        function showReferralModal() {
            fetch('/generate_referral_qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe?.user?.id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById('qr-code').src = `data:image/png;base64,${data.qr_code}`;
                    
                    // Сохраняем ссылку в скрытом атрибуте
                    document.getElementById('referral-link').setAttribute('data-link', data.referral_link);

                    // Скрываем текст ссылки
                    document.getElementById('referral-link').textContent = '';
                    document.getElementById('referral-modal').style.display = 'flex';
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function closeReferralModal() {
            document.getElementById('referral-modal').style.display = 'none';
        }

        function sendReferralLink() {
            const referralLink = document.getElementById('referral-link').getAttribute('data-link');

            if (referralLink) {
                const shareLink = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}`;
                Telegram.WebApp.openTelegramLink(shareLink);
                Telegram.WebApp.close();
            } else {
                alert('Referral link not found.');
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.querySelectorAll('.nav-bar button').forEach(btn => {
                btn.classList.remove('active');
                let img = btn.querySelector("img");
                let text = btn.querySelector("span");
                let pageName = btn.getAttribute("data-page");

                if (pageName === pageId) {
                    btn.classList.add('active');
                    img.src = `/static/${pageName}-active.png`;
                } else {
                    img.src = `/static/${pageName}-passive.png`;
                }
            });

            document.getElementById(pageId).classList.add('active');

            if (pageId === 'friends-page') {
                updateFriendsList();
            }

        }

        async function fetchTelegramUserData(userId) {
            BOT_TOKEN = "REDACTED_BOT_TOKEN"
            try {
                // 1. Получаем основные данные пользователя
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${userId}`);
                let data = await response.json();

                let username = data.ok
                    ? (data.result.username ? `@${data.result.username}` : `${data.result.first_name} ${data.result.last_name || ''}`)
                    : "@unknown";

                // 2. Запрашиваем фото пользователя (если есть)
                response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUserProfilePhotos?user_id=${userId}&limit=1`);
                data = await response.json();

                let avatar = "https://via.placeholder.com/80"; // Заглушка на случай отсутствия фото

                if (data.ok && data.result.photos.length > 0) {
                    const fileId = data.result.photos[0][0].file_id; // Берем первый аватар пользователя

                    // 3. Запрашиваем URL файла
                    response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                    data = await response.json();

                    if (data.ok) {
                        avatar = `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
                    }
                }

                return { username, avatar };
            } catch (error) {
                console.error("Error fetching Telegram user data:", error);
                return { username: "@unknown", avatar: "https://via.placeholder.com/80" };
            }
        }


        async function updateFriendsList() {
            try {
                const response = await fetch('/get_friends', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: Telegram.WebApp.initDataUnsafe?.user?.id })
                });
                const data = await response.json();
                const friendsList = document.getElementById('friends-list');
                friendsList.innerHTML = '';

                if (data.friends.length === 0) {
                    friendsList.innerHTML = '<p>No friends yet.</p>';
                    return;
                }

                for (const friend of data.friends) {
                    const userInfo = await fetchTelegramUserData(friend.user_id);

                    const friendDiv = document.createElement('div');
                    friendDiv.classList.add('friend-info');
                    friendDiv.innerHTML = `
                        <div class="friend-left-section">
                            <img src="${userInfo.avatar}" alt="Avatar">
                            <div class="friend-details">
                                <p>${userInfo.username}</p>
                                <p>${friend.coins} AFN</p>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteFriend('${friend.user_id}')">Delete</button>
                    `;

                    friendsList.appendChild(friendDiv);
                }
            } catch (error) {
                console.error('Error fetching friends:', error);
            }
        }

        function deleteFriend(userId) {
            fetch('/delete_friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    user_id: Telegram.WebApp.initDataUnsafe?.user?.id,
                    friend_id: userId 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateFriendsList(); // Перезагружаем список друзей
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => console.error('Error:', error));
        }


        window.onload = function () {
            updateUserInfo();
            updateCounter();
            showPage('main-page'); // Показываем страницу Main по умолчанию
        };

        function getConsentLink() {
            alert('Здесь будет логика для Consent Link');
        }
    </script>
</head>
<body>
    <!-- Шапка сайта: заголовок по центру, под ним аватар+ник+коины слева и кнопка настроек справа -->
    <header>
        <!-- <h1>Affinia</h1> -->
        <div class="top-bar">
            <div class="left-section">
                <img id="user-avatar" src="https://via.placeholder.com/80" alt="User Avatar">
                <div class="user-details">
                    <p id="username">Loading...</p>
                    <p id="counter">Loading...</p>
                </div>
            </div>
            <!-- Кнопка настроек (вертикальные три точки) -->
            <button class="settings-btn">⋮</button>
        </div>
    </header>

    <!-- Контейнер для страниц (основного контента) -->
    <div class="main-content">
        <!-- Страница Main -->
        <div id="main-page" class="page">
            <div class="center-content">
                <button onclick="showReferralModal()">Referral Link</button>
                <button onclick="getConsentLink()">Consent Link</button>
            </div>
            <!-- Контейнер для кнопки SOS, фиксированно над навбаром -->
            <div class="sos-container">
                <button class="sos-button" onclick="window.location.href='tel:112';">SOS</button>
            </div>                          
        </div>

        <!-- Страница Friends -->
        <div id="friends-page" class="page">
            <h2 style="text-align:center;">Friends</h2>
            <div id="friends-list">
                <p>Loading...</p>
            </div>        
        </div>

        <!-- Страница b3 -->
        <div id="beloved-page" class="page">
            <h2 style="text-align:center;">Beloved</h2>
            <!-- Контент для beloved -->
        </div>

        <!-- Страница b4 -->
        <div id="wallet-page" class="page">
            <h2 style="text-align:center;">Wallet</h2>
            <!-- Контент для wallet -->
        </div>
        <!-- Страница mission -->
        <div id="mission-page" class="page">
            <h2 style="text-align:center;">Mission</h2>
            <!-- Контент для mission -->
        </div>
    </div>

    <!-- Навигационная панель снизу с 4 кнопками -->
    <div class="nav-bar">
        <button data-page="main-page" onclick="showPage('main-page')">
            <img src="/static/home-passive.png" alt="Main">
            <span>Main</span>
        </button>
        <button data-page="friends-page" onclick="showPage('friends-page')">
            <img src="/static/friends-passive.png" alt="Friends">
            <span>Friends</span>
        </button>
        <button data-page="beloved-page" onclick="showPage('beloved-page')">
            <img src="/static/beloved-passive.png" alt="Beloved">
            <span>Beloved</span>
        </button>
        <button data-page="mission-page" onclick="showPage('mission-page')">
            <img src="/static/mission-passive.png" alt="Mission">
            <span>Mission</span>
        </button>
        <button data-page="wallet-page" onclick="showPage('wallet-page')">
            <img src="/static/wallet-passive.png" alt="Wallet">
            <span>Wallet</span>
        </button>
    </div>

    <!-- Модальное окно реферальной ссылки -->
    <div id="referral-modal">
        <div id="referral-modal-content">
            <button id="close-referral-modal" onclick="closeReferralModal()">×</button>
            <h3>Your Referral Link</h3>
            <img id="qr-code" src="" alt="QR Code" style="width:200px; height:200px;">
            <!-- Текст ссылки скрыт, но значение хранится в data-link -->
            <p id="referral-link" style="visibility: hidden;"></p>
            <button onclick="sendReferralLink()">Send</button>
        </div>
    </div>
</body>
</html>
